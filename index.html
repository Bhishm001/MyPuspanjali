<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puspanjali Stores POS — Cloud Sync</title>

<!-- Google Login -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
:root {
  --bg:#f4f6fb; --card:#fff; --accent:#2563eb; --muted:#666;
}
*{box-sizing:border-box;font-family:system-ui,Segoe UI,Roboto}
body{margin:0;background:var(--bg)}
.container{max-width:1100px;margin:auto;padding:16px}
.card{background:var(--card);border-radius:8px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
h1,h2,h3{margin:6px 0}
input,select,button{width:100%;padding:8px;margin-top:6px}
button{cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden{display:none}
.error{color:#b00020;font-size:13px}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{border-bottom:1px solid #eee;padding:6px;text-align:left}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.small{font-size:13px;padding:6px}
footer{text-align:center;color:#777;font-size:13px;margin-top:10px}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="container">
  <div class="card" style="max-width:360px;margin:auto">
    <h2>Puspanjali POS Login</h2>
    <input id="loginUser" placeholder="Username">
    <input id="loginPass" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <div id="loginError" class="error hidden">Invalid credentials</div>
  </div>
</div>

<!-- APP -->
<div id="app" class="container hidden">

<header class="card">
  <h1>Puspanjali Stores — POS</h1>
  <div class="actions">
    <button id="googleLogin" class="small">Sign in with Google</button>
    <button id="syncUp" class="small">☁ Sync to Cloud</button>
    <button id="syncDown" class="small">☁ Sync from Cloud</button>
    <button id="logout" class="small">Logout</button>
  </div>
</header>

<div class="row" style="margin-top:12px">

<!-- PRODUCTS -->
<div class="card">
  <h3>Products</h3>
  <input id="pName" placeholder="Product name">
  <input id="pPrice" type="number" placeholder="Price">
  <input id="pStock" type="number" placeholder="Stock">
  <button id="addProduct">Add / Update</button>

  <table>
    <thead><tr><th>Name</th><th>Price</th><th>Stock</th><th></th></tr></thead>
    <tbody id="productTable"></tbody>
  </table>
</div>

<!-- BILLING -->
<div class="card">
  <h3>Create Bill</h3>
  <select id="selectProduct"></select>
  <input id="qty" type="number" placeholder="Quantity">
  <button id="addCart">Add to Cart</button>

  <table>
    <thead><tr><th>Item</th><th>Qty</th><th>Amt</th></tr></thead>
    <tbody id="cartTable"></tbody>
  </table>

  <h3>Total: ₹ <span id="total">0</span></h3>
  <button id="saveSale">Save Sale</button>
</div>

</div>

<footer>Offline POS with Google Drive Cloud Sync</footer>
</div>

<script>
/* ================= CONFIG ================= */
const LOGIN_USER = "Puspanjali";
const LOGIN_PASS = "Welcome1";

const GOOGLE_CLIENT_ID =
"728514006606-jmcucjfbl9m9jgvhvpmkb5s3trla7c8n.apps.googleusercontent.com";

const DRIVE_FILE = "puspanjali_pos_cloud.json";

const KEY_PRODUCTS = "ps_products";
const KEY_SALES = "ps_sales";

/* ================= STATE ================= */
let products = JSON.parse(localStorage.getItem(KEY_PRODUCTS) || "[]");
let sales = JSON.parse(localStorage.getItem(KEY_SALES) || "[]");
let cart = [];
let token = null;

/* ================= LOGIN ================= */
loginBtn.onclick = () => {
  if (loginUser.value === LOGIN_USER && loginPass.value === LOGIN_PASS) {
    loginBox.classList.add("hidden");
    app.classList.remove("hidden");
    render();
  } else {
    loginError.classList.remove("hidden");
  }
};
logout.onclick = () => location.reload();

/* ================= GOOGLE LOGIN ================= */
googleLogin.onclick = () => {
  google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: "https://www.googleapis.com/auth/drive.file",
    callback: r => {
      token = r.access_token;
      alert("Google Drive connected");
    }
  }).requestAccessToken();
};

/* ================= PRODUCTS ================= */
addProduct.onclick = () => {
  const name = pName.value.trim();
  const price = +pPrice.value;
  const stock = +pStock.value;
  if (!name || price<=0) return;

  const p = products.find(x=>x.name===name);
  if (p) {
    p.price = price;
    p.stock += stock;
  } else {
    products.push({id:Date.now(),name,price,stock});
  }
  save();
  render();
};

function renderProducts() {
  productTable.innerHTML = "";
  selectProduct.innerHTML = "";
  products.forEach(p=>{
    productTable.innerHTML +=
      `<tr><td>${p.name}</td><td>${p.price}</td><td>${p.stock}</td>
      <td><button onclick="delProd(${p.id})">X</button></td></tr>`;
    selectProduct.innerHTML +=
      `<option value="${p.id}">${p.name}</option>`;
  });
}

window.delProd = id => {
  products = products.filter(p=>p.id!==id);
  save(); render();
};

/* ================= CART ================= */
addCart.onclick = () => {
  const p = products.find(x=>x.id==selectProduct.value);
  const q = +qty.value;
  if (!p || q<=0) return;
  cart.push({name:p.name,qty:q,amt:q*p.price});
  renderCart();
};

function renderCart() {
  cartTable.innerHTML="";
  let t=0;
  cart.forEach(c=>{
    t+=c.amt;
    cartTable.innerHTML+=
      `<tr><td>${c.name}</td><td>${c.qty}</td><td>${c.amt}</td></tr>`;
  });
  total.textContent=t;
}

/* ================= SALES ================= */
saveSale.onclick = () => {
  if (!cart.length) return;
  sales.push({date:new Date(),items:cart});
  cart=[];
  save(); render();
};

/* ================= STORAGE ================= */
function save(){
  localStorage.setItem(KEY_PRODUCTS,JSON.stringify(products));
  localStorage.setItem(KEY_SALES,JSON.stringify(sales));
}

/* ================= CLOUD SYNC ================= */
async function findFile(){
  const r = await fetch(
    `https://www.googleapis.com/drive/v3/files?q=name='${DRIVE_FILE}'`,
    {headers:{Authorization:`Bearer ${token}`}}
  );
  const j = await r.json();
  return j.files?.[0]?.id || null;
}

syncUp.onclick = async () => {
  if(!token) return alert("Login Google first");
  const data = JSON.stringify({products,sales});
  const id = await findFile();
  if(id){
    await fetch(
      `https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,
      {method:"PATCH",headers:{Authorization:`Bearer ${token}`},body:data}
    );
  } else {
    const f=new FormData();
    f.append("metadata",new Blob([JSON.stringify({name:DRIVE_FILE})],{type:"application/json"}));
    f.append("file",new Blob([data],{type:"application/json"}));
    await fetch(
      "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
      {method:"POST",headers:{Authorization:`Bearer ${token}`},body:f}
    );
  }
  alert("Synced to cloud");
};

syncDown.onclick = async () => {
  if(!token) return alert("Login Google first");
  const id = await findFile();
  if(!id) return alert("No cloud data");
  const r = await fetch(
    `https://www.googleapis.com/drive/v3/files/${id}?alt=media`,
    {headers:{Authorization:`Bearer ${token}`}}
  );
  const d = await r.json();
  products=d.products||[];
  sales=d.sales||[];
  save(); render();
  alert("Loaded from cloud");
};

/* ================= RENDER ================= */
function render(){
  renderProducts();
  renderCart();
}
</script>
</body>
</html>
