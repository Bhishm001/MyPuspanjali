<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puspanjali Stores Billing</title>

<style>

body{font-family:Arial;margin:0;background:#f2f2f2}

.container{
max-width:900px;
margin:auto;
padding:15px
}

.card{
background:#fff;
padding:15px;
margin-bottom:15px;
border-radius:8px
}

input,button{
padding:8px;
margin-top:6px;
border-radius:5px;
border:1px solid #ccc;
width:100%
}

button{cursor:pointer}

table{
width:100%;
border-collapse:collapse;
margin-top:10px
}

th,td{
border-bottom:1px solid #eee;
padding:8px;
text-align:left
}

#loginBox{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:#00000080;
display:flex;
align-items:center;
justify-content:center
}

#loginCard{
background:#fff;
padding:20px;
border-radius:8px;
width:300px
}

/* RECEIPT STYLE */

#printArea{
display:none;
width:58mm;
font-family:monospace;
font-size:12px;
padding:5px
}

.center{text-align:center}

@media print{

body *{
visibility:hidden
}

#printArea, #printArea *{
visibility:visible
}

#printArea{
position:absolute;
left:0;
top:0
}

}

</style>
</head>

<body>

<div id="loginBox">
<div id="loginCard">

<h3>Login</h3>

<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="loginError" style="color:red;display:none">Invalid Login</p>

</div>
</div>

<div class="container" id="app" style="display:none">

<div class="card">

<h2>Create Bill</h2>

<input id="itemName" placeholder="Item Name">
<input id="qty" type="number" placeholder="Quantity">
<input id="rate" type="number" placeholder="Rate">

<button onclick="addItem()">Add Item</button>

<table>
<thead>
<tr>
<th>#</th>
<th>Item</th>
<th>Qty</th>
<th>Rate</th>
<th>Amt</th>
<th></th>
</tr>
</thead>

<tbody id="cartBody"></tbody>

</table>

<h3>Total ₹ <span id="total">0</span></h3>

<button onclick="saveBill()">Save & Print</button>
<button onclick="clearBill()">Clear</button>

</div>

</div>

<!-- RECEIPT AREA -->

<div id="printArea"></div>

<script>

const USERNAME="Puspanjali"
const PASSWORD="Welcome1"

let cart=[]

function login(){

if(user.value===USERNAME && pass.value===PASSWORD){

loginBox.style.display="none"
app.style.display="block"

}else{

loginError.style.display="block"

}

}

function addItem(){

let name=itemName.value.trim()
let q=parseFloat(qty.value)
let r=parseFloat(rate.value)

if(!name||!q||!r){
alert("Enter all fields")
return
}

cart.push({name,qty:q,rate:r})

renderCart()

itemName.value=""
qty.value=""
rate.value=""

}

function renderCart(){

cartBody.innerHTML=""

let total=0

cart.forEach((c,i)=>{

let amt=c.qty*c.rate
total+=amt

cartBody.innerHTML+=`
<tr>
<td>${i+1}</td>
<td>${c.name}</td>
<td>${c.qty}</td>
<td>${c.rate}</td>
<td>${amt.toFixed(2)}</td>
<td><button onclick="removeItem(${i})">X</button></td>
</tr>
`

})

document.getElementById("total").innerText=total.toFixed(2)

}

function removeItem(i){

cart.splice(i,1)
renderCart()

}

function clearBill(){

cart=[]
renderCart()

}

function generateInvoice(){

return "INV-"+Date.now()

}

function saveBill(){

if(cart.length===0){
alert("No items")
return
}

let invoice=generateInvoice()

let total=parseFloat(document.getElementById("total").innerText)

let billHTML=`

<div class="center">

<img src="logo.png" width="80" onerror="this.style.display='none'"><br>

<b>PUSPANJALI STORES</b><br>

NAC MARKET SHOP NO.147<br>
SAHARPURA, SINDRI<br>
DHANBAD - 828122<br>
Ph:7677812208<br>

--------------------------------<br>

Invoice: ${invoice}<br>
${new Date().toLocaleString()}<br>

--------------------------------

</div>

<table style="width:100%">
`

cart.forEach((it,i)=>{

billHTML+=`

<tr>
<td>${i+1}.${it.name}</td>
<td>${it.qty}</td>
<td>${it.rate}</td>
<td>${(it.qty*it.rate).toFixed(2)}</td>
</tr>

`

})

billHTML+=`

</table>

<div class="center">

--------------------------------<br>

<b>TOTAL ₹ ${total.toFixed(2)}</b><br><br>

<img src="qr.jpg" width="120" onerror="this.style.display='none'"><br>

Scan PhonePe QR<br><br>

In memory of<br>
Late Shri Jitendra Kumar

</div>
`

document.getElementById("printArea").innerHTML=billHTML

document.getElementById("printArea").style.display="block"

window.print()

clearBill()

}

</script>

</body>
</html>
