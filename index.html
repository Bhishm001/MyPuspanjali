<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puspanjali Stores POS</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
body{font-family:system-ui;background:#f4f6fb;margin:0}
.container{max-width:1100px;margin:auto;padding:14px}
.card{background:#fff;padding:12px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
input,select,button{width:100%;padding:8px;margin-top:6px}
button{cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{border-bottom:1px solid #eee;padding:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none}
.small{font-size:13px;padding:6px}
.grid{display:grid;grid-template-columns:1fr 420px;gap:12px}
</style>
</head>

<body>

<div id="loginBox" class="container">
<div class="card" style="max-width:340px;margin:auto">
<h3>Puspanjali POS Login</h3>
<input id="loginUser" placeholder="Username">
<input id="loginPass" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
</div>
</div>

<div id="app" class="container hidden">

<div class="card">
<h2>Puspanjali Stores POS</h2>
<div class="actions">
<button id="googleLogin" class="small">Sign in Google</button>
<button id="syncUp" class="small">☁ Sync Up</button>
<button id="syncDown" class="small">☁ Sync Down</button>
<button id="logout" class="small">Logout</button>
</div>
</div>

<div class="grid">

<!-- PRODUCTS -->
<div class="card">
<h3>Products</h3>
<input id="pName" placeholder="Name">
<input id="pSku" placeholder="SKU">
<input id="pPrice" type="number" placeholder="Price">
<input id="pStock" type="number" placeholder="Stock">
<select id="pUnit">
<option>Pieces</option><option>Kg</option>
<option>Gram</option><option>Dozen</option>
</select>
<button id="addProduct">Add / Update</button>

<table>
<thead><tr><th>Name</th><th>Stock</th><th></th></tr></thead>
<tbody id="productTable"></tbody>
</table>
</div>

<!-- BILLING -->
<div class="card">
<h3>Billing</h3>
<select id="billProduct"></select>
<input id="billQty" type="number" placeholder="Qty">
<input id="billRate" type="number" placeholder="Rate">
<button id="addCart">Add</button>

<table>
<thead><tr><th>Item</th><th>Qty</th><th>Amt</th></tr></thead>
<tbody id="cartTable"></tbody>
</table>

<input id="discount" type="number" placeholder="Discount" value="0">
<h3>Total ₹ <span id="total">0</span></h3>
<button id="saveBill">Save & Print</button>
</div>

</div>
</div>

<script>
/* CONFIG */
const LOGIN_USER="Puspanjali";
const LOGIN_PASS="Welcome1";
const GOOGLE_CLIENT_ID="728514006606-jmcucjfbl9m9jgvhvpmkb5s3trla7c8n.apps.googleusercontent.com";
const DRIVE_FILE="puspanjali_pos_cloud.json";

let products=JSON.parse(localStorage.ps_products||"[]");
let sales=JSON.parse(localStorage.ps_sales||"[]");
let cart=[];
let token=null;

/* LOGIN */
loginBtn.onclick=()=>{
 if(loginUser.value===LOGIN_USER && loginPass.value===LOGIN_PASS){
  loginBox.classList.add("hidden");
  app.classList.remove("hidden");
  renderProducts();
 }
};
logout.onclick=()=>location.reload();

/* PRODUCTS */
addProduct.onclick=()=>{
 const name=pName.value.trim();
 const price=+pPrice.value;
 const stock=+pStock.value;
 if(!name||price<=0)return;

 let p=products.find(x=>x.name===name);
 if(p){ p.stock+=stock; p.price=price; }
 else products.push({id:Date.now(),name,price,stock});

 save(); renderProducts();
};

function renderProducts(){
 productTable.innerHTML="";
 billProduct.innerHTML="";
 products.forEach(p=>{
  productTable.innerHTML+=
   `<tr><td>${p.name}</td><td>${p.stock}</td>
   <td><button onclick="del(${p.id})">X</button></td></tr>`;
  billProduct.innerHTML+=
   `<option value="${p.id}">${p.name}</option>`;
 });
}
window.del=id=>{products=products.filter(p=>p.id!==id);save();renderProducts();};

/* CART */
addCart.onclick=()=>{
 const p=products.find(x=>x.id==billProduct.value);
 const q=+billQty.value;
 if(!p||q<=0)return;
 cart.push({id:p.id,name:p.name,qty:q,amt:q*p.price});
 renderCart();
};
function renderCart(){
 cartTable.innerHTML="";
 let t=0;
 cart.forEach(c=>{
  t+=c.amt;
  cartTable.innerHTML+=`<tr><td>${c.name}</td><td>${c.qty}</td><td>${c.amt}</td></tr>`;
 });
 total.textContent=t-(+discount.value||0);
}

/* SAVE BILL */
saveBill.onclick=()=>{
 if(!cart.length)return;
 const inv={id:Date.now(),items:cart,total:+total.textContent};
 sales.push(inv);
 cart=[];
 save();
 renderCart();
 printBill(inv);
};

/* STORAGE */
function save(){
 localStorage.ps_products=JSON.stringify(products);
 localStorage.ps_sales=JSON.stringify(sales);
}

/* PRINT */
function printBill(inv){
 const w=window.open("");
 w.document.write(`<body style="font-family:monospace;width:58mm">
 <center><b>Puspanjali Stores</b></center><hr>
 ${inv.items.map(i=>`${i.name} ${i.qty} = ${i.amt}`).join("<br>")}
 <hr>Total ₹${inv.total}<hr>Thank you</body>`);
 w.print();
}

/* GOOGLE LOGIN */
googleLogin.onclick=()=>{
 if(!window.google)return alert("Refresh");
 const tc=google.accounts.oauth2.initTokenClient({
  client_id:GOOGLE_CLIENT_ID,
  scope:"https://www.googleapis.com/auth/drive.file",
  callback:r=>{token=r.access_token;alert("Drive Connected");}
 });
 tc.requestAccessToken();
};

/* SYNC */
async function findFile(){
 const r=await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${DRIVE_FILE}'`,
 {headers:{Authorization:`Bearer ${token}`}});
 const j=await r.json(); return j.files?.[0]?.id||null;
}

syncUp.onclick=async()=>{
 if(!token)return alert("Login Google");
 const data=JSON.stringify({products,sales});
 const id=await findFile();
 if(id){
  await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,
  {method:"PATCH",headers:{Authorization:`Bearer ${token}`},body:data});
 }else{
  const f=new FormData();
  f.append("metadata",new Blob([JSON.stringify({name:DRIVE_FILE})],{type:"application/json"}));
  f.append("file",new Blob([data]));
  await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
  {method:"POST",headers:{Authorization:`Bearer ${token}`},body:f});
 }
 alert("Synced");
};

syncDown.onclick=async()=>{
 if(!token)return alert("Login Google");
 const id=await findFile();
 if(!id)return alert("No cloud file");
 const r=await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,
 {headers:{Authorization:`Bearer ${token}`}});
 const d=await r.json();
 products=d.products||[];
 sales=d.sales||[];
 save(); renderProducts();
 alert("Loaded");
};
</script>
</body>
</html>
